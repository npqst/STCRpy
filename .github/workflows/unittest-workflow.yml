name: stcrpy unittests

on:
  push:
  workflow_dispatch:

jobs:
  fast-tests:
    name: Fast tests (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: ${{ matrix.python-version }}
          activate-environment: env
          channels: conda-forge
          channel-priority: flexible
          show-channel-urls: true
      - name: Conda info
        shell: bash -el {0}
        run: |
          conda info
          conda config --show-sources
      - name: Conda list
        shell: pwsh
        run: conda list
      - name: Install dependencies
        shell: bash -el {0}
        run: |
          python --version
          conda install -y pip            # macos-latest ships a framework python whose pip shadows the env; ensure env-local pip
          python -m pip install '.[dev]'  # -m pip targets the active env interpreter, not the framework python
          python -m pip list
      - name: Build ANARCI Models
        shell: bash -el {0}
        run: |
          python -c "from anarci.build_models import build_models; build_models()"
      - name: Install pymol and pytorch
        shell: bash -el {0}
        run: |
          conda install -c conda-forge pymol-open-source numpy==1.26.4      # freeze numpy to prevent dockQ incompatibility
          conda list
          python -m pip install '.[ml_datasets]'
      - name: Test import
        shell: bash -el {0}
        run: |
          python -c 'import stcrpy; stcrpy.fetch_TCRs("7pb2")'
      - name: Run fast tests
        shell: bash -el {0}
        run: |
          pytest -m "not slow" -v

  slow-tests:
    name: Full dataset tests (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: ${{ matrix.python-version }}
          activate-environment: env
          channels: conda-forge
          channel-priority: flexible
          show-channel-urls: true
      - name: Install dependencies
        shell: bash -el {0}
        run: |
          python --version
          conda install -y pip            # macos-latest ships a framework python whose pip shadows the env; ensure env-local pip
          python -m pip install '.[dev]'  # -m pip targets the active env interpreter, not the framework python
      - name: Build ANARCI Models
        shell: bash -el {0}
        run: |
          python -c "from anarci.build_models import build_models; build_models()"
      - name: Run slow tests
        shell: bash -el {0}
        run: |
          pytest -m slow -v
