[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "stcrpy"
version = "1.0.6"
description = "Set of methods to parse, annotate, and calculate features of TCR structures"
readme = "README.md"
license-files = [
    "LICENCE",
    "stcrpy/tcr_geometry/TCRCoM_LICENCE",
]
maintainers = [
  {name = "Nele Quast", email = "quast@stats.ox.ac.uk"}
]
requires-python = ">=3.10"
dependencies = [
  "biopython",
  "numpy==1.26.4",      # required by DockQ
  "lxml",
  "openbabel-wheel==3.1.1.21",
  "rdkit",
  "pyhmmer==0.11.4",        # fix pyhmmer version to prevent string encoding bu. TODO:fix this within anarci-mhc directly and redeploy
  "anarci-mhc",
  "pandas",
  "matplotlib",
  "scipy",
  "requests",
  "scikit-learn",
  "DockQ",
]

[project.optional-dependencies]
ml_datasets = [
    "einops",
    "torch",
    "torch_geometric",
]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["test"]
markers = [
    "slow: marks tests as slow (large dataset, network-heavy); deselect with '-m \"not slow\"'",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
exclude = ["test", "test.*"]

[tool.setuptools.package-data]
stcrpy = ["tcr_geometry/reference_data/*", ]
